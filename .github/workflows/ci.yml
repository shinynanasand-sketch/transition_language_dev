name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python and deps
        run: uv sync --dev
      - name: Run tests (demo, no OpenAI key)
        run: uv run pytest -q
